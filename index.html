<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MegToon</title>

    <!-- CSS -->
    <link rel="stylesheet" href="gayaa.css" />
    <link rel="stylesheet" href="filterProduct.css" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-white text-gray-800">
    <!-- ================= HEADER ================= -->
    <header class="border-b bg-white/95 sticky top-0 z-50 backdrop-blur-sm">
      <div
        class="w-full pl-4 pr-4 py-4 flex items-center justify-between gap-2"
      >
        <div class="flex items-center gap-3 w-full">
          <div
            class="w-10 h-10 bg-gradient-to-r from-orange-400 to-red-500 rounded-xl flex items-center justify-center text-white text-lg font-bold"
          >
            📚
          </div>

          <div class="hidden sm:block">
            <div class="text-lg font-semibold">MegToon</div>
            <div class="text-xs text-gray-500">Local Manga Shop</div>
          </div>

          <div class="flex-1 ml-4 max-w-md">
            <input
              id="search"
              type="search"
              placeholder="Search manga..."
              class="w-full h-9 px-3 text-sm rounded-full border focus:outline-none focus:ring-2 focus:ring-orange-300"
            />
          </div>
        </div>

        <button
          onclick="openCart()"
          class="relative w-10 h-10 flex items-center justify-center rounded-full border hover:bg-gray-100"
        >
          🛒
          <span
            id="cart-count"
            class="absolute -top-1 -right-1 bg-orange-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center"
          >
            0
          </span>
        </button>
      </div>
    </header>

    <!-- ================= HERO ================= -->
    <section
      class="overflow-hidden bg-gradient-to-br from-orange-400 via-orange-500 to-red-500 min-h-[75vh] sm:grid sm:grid-cols-2 items-center"
    >
      <div class="p-8 md:p-12 lg:px-16 lg:py-20">
        <div class="max-w-xl">
          <h1
            class="text-5xl md:text-6xl font-black text-white leading-tight mb-6"
          >
            Your Local Manga Paradise
          </h1>

          <p class="text-lg text-white/90 mb-8 hidden md:block">
            Discover the latest and greatest manga titles. From classic series
            to new releases, we have everything for manga lovers.
          </p>

          <a
            href="#products"
            class="inline-block bg-white text-orange-600 px-6 py-3 rounded-full font-bold hover:bg-orange-100 transition"
          >
            Get Started
          </a>
        </div>
      </div>

      <div class="relative min-h-[400px]">
        <img
          src="image.png"
          alt="Manga Collection"
          class="w-full h-full object-cover rounded-l-3xl shadow-2xl"
        />
      </div>
    </section>

    <!-- ================= FILTER ================= -->
    <section class="max-w-7xl mx-auto px-4 py-8">
      <div
        id="buttons"
        class="flex flex-wrap gap-3 items-center justify-center md:justify-start"
      >
        <button data-cat="all" class="category-btn">Semua <span class="count">0</span></button>
        <button data-cat="Shonen" class="category-btn">Shonen <span class="count">0</span></button>
        <button data-cat="Seinen" class="category-btn">Seinen <span class="count">0</span></button>
        <button data-cat="Shoujo" class="category-btn">Shoujo <span class="count">0</span></button>
      </div>

      <div
        id="products"
        class="grid gap-6 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 mt-8"
      ></div>
    </section>

    <!-- ================= DATA ================= -->
    <script src="products.js"></script>

    <!-- ================= LOGIC ================= -->
    <script>
      const products = window.PRODUCTS || [];
      const productsContainer = document.getElementById("products");
      const cartCountEl = document.getElementById("cart-count");

      function formatPrice(p) {
        return "$" + p.toFixed(2);
      }

      function displayProducts(items) {
        productsContainer.innerHTML = "";
        items.forEach((p) => {
          productsContainer.innerHTML += `
          <div class="border rounded-lg overflow-hidden bg-white hover:shadow-lg transition">
            <div class="p-4 cursor-pointer" onclick='openProductPanel(${JSON.stringify(p)})'>
              <img src="${p.img}" class="h-48 w-full object-contain mb-3">
              <h3 class="font-semibold">${p.title}</h3>
              <p class="text-sm text-gray-500 line-clamp-2">${p.description}</p>
              <div class="text-xl font-bold text-emerald-600 mt-2">
                ${formatPrice(p.price)}
              </div>
            </div>
            <div class="p-4 pt-0">
              <button onclick='addToCart(${JSON.stringify(p)})'
                class="w-full bg-orange-500 text-white py-2 rounded hover:bg-orange-600">
                Add to Cart
              </button>
            </div>
          </div>
        `;
        });
      }

      // Category
      const buttons = document.querySelectorAll(".category-btn");
      let currentCategory = "all";

      function updateCategoryCounts() {
        const counts = { all: products.length };
        products.forEach((p) => {
          counts[p.category] = (counts[p.category] || 0) + 1;
        });
        buttons.forEach((btn) => {
          btn.querySelector(".count").textContent =
            counts[btn.dataset.cat] || 0;
        });
      }

      function filterProducts(cat) {
        currentCategory = cat;
        const filtered =
          cat === "all"
            ? products
            : products.filter((p) => p.category === cat);
        displayProducts(filtered);
      }

      buttons.forEach((btn) =>
        btn.addEventListener("click", () =>
          filterProducts(btn.dataset.cat)
        )
      );

      // Search
      document.getElementById("search").addEventListener("input", (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = products.filter(
          (p) =>
            (currentCategory === "all" ||
              p.category === currentCategory) &&
            p.title.toLowerCase().includes(term)
        );
        displayProducts(filtered);
      });

      // Cart
      let cart = JSON.parse(localStorage.getItem("megtoon_cart")) || [];

      function saveCart() {
        localStorage.setItem("megtoon_cart", JSON.stringify(cart));
      }

      function addToCart(p) {
        const item = cart.find((i) => i.id === p.id);
        if (item) item.qty++;
        else cart.push({ ...p, qty: 1 });
        saveCart();
        updateCartCount();
      }

      function updateCartCount() {
        cartCountEl.textContent = cart.reduce((a, b) => a + b.qty, 0);
      }

      function openCart() {
        alert("Cart feature aktif 👍");
      }

      // Init
      updateCategoryCounts();
      filterProducts("all");
      updateCartCount();
    </script>

    <!-- ================= FOOTER ================= -->
    <footer class="bg-orange-50 mt-20">
      <div class="max-w-5xl mx-auto px-4 py-12 text-center">
        <div class="text-3xl font-bold text-orange-500 mb-4">📚 MegToon</div>
        <p class="text-gray-600">
          Your one-stop destination for manga shopping.
        </p>
        <p class="mt-6 text-sm text-gray-500">
          © 2025 MegToon. All rights reserved.
        </p>
      </div>
    </footer>
  </body>
</html>
